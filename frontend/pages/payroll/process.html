<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Plus - Process Payroll</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="hrp-app">
    <aside class="hrp-sidebar" id="hrp-sidebar-mount"></aside>
    <div class="hrp-main">
      <header class="hrp-topbar" id="hrp-topbar-mount"></header>
      <main class="hrp-content">
        <div class="d-flex align-items-center gap-2 mb-3">
          <a href="periods.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
          <h5 class="mb-0">Process Payroll</h5>
        </div>

        <div class="hrp-card" style="max-width:480px;">
          <p class="text-muted-sm">This runs the payroll calculation (basic salary + allowances + overtime - attendance/no-pay deductions - loans) for every active employee in the selected period, inside a single database transaction.</p>
          <form id="hrp-process-form">
            <div class="mb-3">
              <label class="form-label">Payroll Period</label>
              <select class="form-select" id="hrp-process-period" required></select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Process Payroll</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/navigation.js"></script>
  <script src="../../js/payroll.js"></script>
  <script>
    HrpLayout.init({ title: 'Process Payroll', match: 'payroll/periods' }).then(() => HrpPayroll.initProcessPage());
  </script>
</body>
</html>
