<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Plus - Monthly Attendance</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="hrp-app">
    <aside class="hrp-sidebar" id="hrp-sidebar-mount"></aside>
    <div class="hrp-main">
      <header class="hrp-topbar" id="hrp-topbar-mount"></header>
      <main class="hrp-content">
        <div class="d-flex align-items-center gap-2 mb-3">
          <a href="index.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
          <h5 class="mb-0">Monthly Attendance</h5>
          <input type="month" class="form-control form-control-sm ms-2" style="width:170px" id="hrp-monthly-month">
        </div>

        <div class="hrp-table-card">
          <div class="table-responsive">
            <table class="table hrp-table mb-0">
              <thead><tr><th>Code</th><th>Name</th><th>Present</th><th>Absent</th><th>Leave</th><th>Attendance Rate</th><th>Overtime (min)</th></tr></thead>
              <tbody id="hrp-monthly-table"><tr><td colspan="7" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/navigation.js"></script>
  <script src="../../js/attendance.js"></script>
  <script>
    HrpLayout.init({ title: 'Monthly Attendance', match: 'attendance/index' }).then(() => HrpAttendance.initMonthlyPage());
  </script>
</body>
</html>
