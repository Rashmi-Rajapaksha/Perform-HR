<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Plus - Improvement Plans</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="hrp-app">
    <aside class="hrp-sidebar" id="hrp-sidebar-mount"></aside>
    <div class="hrp-main">
      <header class="hrp-topbar" id="hrp-topbar-mount"></header>
      <main class="hrp-content">
        <div class="d-flex align-items-center gap-2 mb-3">
          <a href="evaluations.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
          <h5 class="mb-0">Performance Improvement Plans</h5>
        </div>
        <div class="hrp-table-card">
          <div class="table-responsive">
            <table class="table hrp-table mb-0">
              <thead><tr><th>Employee</th><th>Description</th><th>Target Date</th><th>Status</th></tr></thead>
              <tbody id="hrp-plans-table"><tr><td colspan="4" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/navigation.js"></script>
  <script src="../../js/performance.js"></script>
  <script>
    HrpLayout.init({ title: 'Improvement Plans', match: 'performance/evaluations' }).then(() => HrpPerformance.initImprovementPlansPage());
  </script>
</body>
</html>
