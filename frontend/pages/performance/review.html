<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Plus - Review Evaluation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="hrp-app">
    <aside class="hrp-sidebar" id="hrp-sidebar-mount"></aside>
    <div class="hrp-main">
      <header class="hrp-topbar" id="hrp-topbar-mount"></header>
      <main class="hrp-content">
        <div class="d-flex align-items-center gap-2 mb-3">
          <a href="evaluations.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
          <h5 class="mb-0"><span id="hrp-review-employee"></span> — <span id="hrp-review-period"></span></h5>
          <span id="hrp-review-status"></span>
        </div>

        <div class="row g-3">
          <div class="col-lg-7">
            <div class="hrp-card mb-3">
              <h6>KPI Breakdown (Automated Score: <span id="hrp-review-kpi-score"></span>)</h6>
              <div class="table-responsive">
                <table class="table hrp-table table-sm mb-0">
                  <thead><tr><th>KPI ID</th><th>Target</th><th>Actual</th><th>Achievement</th><th>Weight</th><th>Weighted Score</th></tr></thead>
                  <tbody id="hrp-review-detail-table"></tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="hrp-card">
              <h6>Manager Review</h6>
              <form id="hrp-review-form">
                <div class="mb-2"><label class="form-label">Manager Score (0-100)</label><input type="number" min="0" max="100" step="0.1" class="form-control form-control-sm" id="hrp-manager-score-input" required></div>
                <div class="mb-2"><label class="form-label">Manager Comments</label><textarea class="form-control form-control-sm" id="hrp-manager-comments-input" rows="2"></textarea></div>
                <div class="mb-2"><label class="form-label">Strengths</label><textarea class="form-control form-control-sm" id="hrp-strengths-input" rows="2"></textarea></div>
                <div class="mb-3"><label class="form-label">Areas for Improvement</label><textarea class="form-control form-control-sm" id="hrp-weaknesses-input" rows="2"></textarea></div>
                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary btn-sm flex-fill">Save Review</button>
                  <button type="button" class="btn btn-success btn-sm flex-fill" id="hrp-finalize-btn">Finalize</button>
                </div>
              </form>
              <hr>
              <button type="button" class="btn btn-outline-warning btn-sm w-100" id="hrp-create-plan-btn"><i class="bi bi-clipboard-plus"></i> Create Improvement Plan</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/navigation.js"></script>
  <script src="../../js/performance.js"></script>
  <script>
    HrpLayout.init({ title: 'Review Evaluation', match: 'performance/evaluations' }).then(() => HrpPerformance.initReviewPage());
  </script>
</body>
</html>
