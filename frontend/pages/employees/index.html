<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Plus - Employees</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="hrp-app">
    <aside class="hrp-sidebar" id="hrp-sidebar-mount"></aside>
    <div class="hrp-main">
      <header class="hrp-topbar" id="hrp-topbar-mount"></header>
      <main class="hrp-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Employees</h5>
          <a href="create.html" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Add Employee</a>
        </div>

        <div class="hrp-table-card">
          <div class="hrp-table-toolbar">
            <input type="text" class="form-control form-control-sm" style="width:220px" id="hrp-filter-search" placeholder="Search name or code...">
            <div class="filters">
              <select class="form-select form-select-sm" id="hrp-filter-department"></select>
              <select class="form-select form-select-sm" id="hrp-filter-designation"></select>
              <select class="form-select form-select-sm" id="hrp-filter-status">
                <option value="">All Statuses</option>
                <option value="ACTIVE">Active</option>
                <option value="ON_LEAVE">On Leave</option>
                <option value="SUSPENDED">Suspended</option>
                <option value="RESIGNED">Resigned</option>
                <option value="TERMINATED">Terminated</option>
              </select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table hrp-table mb-0">
              <thead>
                <tr><th>Code</th><th>Name</th><th>Department</th><th>Designation</th><th>Manager</th><th>Status</th><th></th></tr>
              </thead>
              <tbody id="hrp-employee-table-body">
                <tr><td colspan="7" class="text-center py-4"><div class="spinner-border spinner-border-sm"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="hrp-table-footer">
            <span>Employee directory</span>
            <nav><ul class="pagination pagination-sm mb-0" id="hrp-pagination"></ul></nav>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/navigation.js"></script>
  <script src="../../js/employees.js"></script>
  <script>
    HrpLayout.init({ title: 'Employees', match: 'employees/index' }).then(() => HrpEmployees.initListPage());
  </script>
</body>
</html>
