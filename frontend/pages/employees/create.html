<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Plus - Add Employee</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="hrp-app">
    <aside class="hrp-sidebar" id="hrp-sidebar-mount"></aside>
    <div class="hrp-main">
      <header class="hrp-topbar" id="hrp-topbar-mount"></header>
      <main class="hrp-content">
        <div class="d-flex align-items-center gap-2 mb-3">
          <a href="index.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
          <h5 class="mb-0">Add Employee</h5>
        </div>

        <form id="hrp-employee-form" class="hrp-card" style="max-width:820px;">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Employee Code</label>
              <input type="text" class="form-control" id="hrp-form-code" required placeholder="EMP0101">
            </div>
            <div class="col-md-4">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" id="hrp-form-first-name" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" id="hrp-form-last-name" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Gender</label>
              <select class="form-select" id="hrp-form-gender">
                <option value="">Not specified</option>
                <option value="MALE">Male</option>
                <option value="FEMALE">Female</option>
                <option value="OTHER">Other</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="hrp-form-email">
            </div>
            <div class="col-md-4">
              <label class="form-label">Phone</label>
              <input type="text" class="form-control" id="hrp-form-phone">
            </div>

            <div class="col-md-4">
              <label class="form-label">Department</label>
              <select class="form-select" id="hrp-form-department" required></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Designation</label>
              <select class="form-select" id="hrp-form-designation" required></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Reporting Manager</label>
              <select class="form-select" id="hrp-form-manager"></select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Employment Type</label>
              <select class="form-select" id="hrp-form-employment-type" required></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Work Schedule</label>
              <select class="form-select" id="hrp-form-schedule" required>
                <option value="FIXED">Fixed</option>
                <option value="ROTATING">Rotating</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Join Date</label>
              <input type="date" class="form-control" id="hrp-form-join-date" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Basic Salary</label>
              <input type="number" step="0.01" min="0" class="form-control" id="hrp-form-salary" required>
            </div>
          </div>

          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Create Employee</button>
            <a href="index.html" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/navigation.js"></script>
  <script src="../../js/employees.js"></script>
  <script>
    HrpLayout.init({ title: 'Add Employee', match: 'employees/index' }).then(() => HrpEmployees.initCreatePage());
  </script>
</body>
</html>
